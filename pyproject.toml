[project]
name = "simonpro"
version = "0.1.0"
description = "SiMonPro - pencatatan produksi dan inspeksi kemasan sarden kaleng berbasis IoT dan AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.8.7",
    "matplotlib>=3.10.9",
    "psycopg2-binary>=2.9.12",
    "pyqt6>=6.11.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.2",
    "qtawesome>=1.4.2",
    "reportlab>=4.5.0",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.9",
    "httpx>=0.28",
]
# REST API server (runs on the edge server, pn@endeavour)
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pillow>=11.0",
    "numpy>=1.26",
]
# PatchCore model (server inference + ml/ scripts). Pick exactly one:
#   ml      GPU build: CUDA 12.8 wheels on Linux (~3 GB), PyPI wheels elsewhere. Also runs on CPU.
#   ml-cpu  CPU-only build (~250 MB), for machines without an NVIDIA GPU.
ml = [
    "torch>=2.6",
    "torchvision>=0.21",
]
ml-cpu = [
    "torch>=2.6",
    "torchvision>=0.21",
]

[tool.uv]
# ml and ml-cpu install different builds of the same packages.
conflicts = [[{ group = "ml" }, { group = "ml-cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", group = "ml", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "ml-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu128", group = "ml", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "ml-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff defaults; keeps lint independent of personal configs
