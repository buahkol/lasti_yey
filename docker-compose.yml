services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: simonpro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/00-create-test-db.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/dummy.sql:/docker-entrypoint-initdb.d/02-dummy.sql
    restart: unless-stopped

volumes:
  pgdata:

